<section id="ALL_PEOPLE_SECTION">
  <h2 class="all_h2">ALL PEOPLE</h2>

  <table class="table table-bordered">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Family</th>
      <th>Username</th>
      <th>Commands</th>
    </tr>
    <!-- NG_REPEAT -->
    <tr ng-repeat="p in people track by $index">
      <td>{{p.id}}</td>
      <td>{{p.name.firstname}}</td>
      <td>{{p.name.lastname}}</td>
      <td>{{p.username}}</td>
      <td>Commands</td>
    </tr>
  </table>
</section>
