<form novalidate name="myForm">
  <!-- FIRST NAME -->
  <div class="input__field">
    <label for="firstname">Firstname:</label>
    <input
      ng-class="{'valid_input': myForm.firstname.$valid}"
      type="text"
      ng-required="true"
      ng-minlength="4"
      name="firstname"
      placeholder="firstname"
      ng-model="user.firstname"
    />
    <p class="form__error" ng-if="!vm.isFormSubmitted && myForm.firstname.$touched && myForm.firstname.$invalid">
      Firstname is Required
    </p>
    <i class="ph-fill ph-seal-check" ng-if="myForm.firstname.$valid"></i>
  </div>
  <space></space>
  <div class="input__field">
    <label for="lastname">Lastname:</label>
    <input
      ng-class="{'valid_input': myForm.lastname.$valid}"
      type="text"
      ng-required="true"
      ng-minlength="5"
      name="lastname"
      placeholder="Lastname"
      ng-model="user.lastname"
    />
    <p class="form__error" ng-if="!vm.isFormSubmitted && myForm.lastname.$touched && myForm.lastname.$invalid">
      Lastname is Required
    </p>
    <i class="ph-fill ph-seal-check err" ng-if="myForm.lastname.$valid"></i>
  </div>
  <space></space>
  <div class="input__field">
    <label for="age">Age:</label>
    <input
      ng-class="{'valid_input': myForm.age.$valid}"
      ng-minlength="1"
      ng-maxlength="2"
      ng-required="true"
      type="text"
      name="age"
      placeholder="Age"
      ng-model="user.age"
    />
    <p class="form__error" ng-if="!vm.isFormSubmitted && myForm.age.$touched && myForm.age.$invalid">
      Please Enter a valid Age
    </p>
    <i class="ph-fill ph-seal-check" ng-if="myForm.age.$valid"></i>
  </div>
  <space></space>
  <div class="input__field">
    <label for="age">Country:</label>
    <select
      ng-required="true"
      ng-model="user.country"
      aria-placeholder="Country"
      name="country"
      id="country"
      class="country_select"
    >
      <option value="IRAN" selected>IRAN</option>
      <option value="USA">USA</option>
      <option value="GER">GERMANY</option>
    </select>
    <p class="form__error" ng-if="!vm.isFormSubmitted && myForm.country.$touched && myForm.country.$invalid">
      Please Select Your Country
    </p>
    <i class="ph-fill ph-seal-check" ng-if="myForm.country.$valid"></i>
  </div>
  <space></space>
  <div class="input__field">
    <label for="phone">PhoneNumber: </label>
    <input ng-required="true" ng-model="user.phone" type="text" name="phone" placeholder="Phonenumber" />
    <p class="form__error" ng-if="!vm.isFormSubmitted && myForm.phone.$touched && myForm.phone.$invalid">
      Please Enter a valid Phonenumber
    </p>
    <i class="ph-fill ph-seal-check" ng-if="myForm.phone.$valid"></i>
  </div>

  <separator></separator>
  <button ng-disabled="myForm.$invalid" ng-click="onSubmit()" class="success m-0 w-full">SUBMIT FORM</button>

  <space ng-if="isUserExist > 0"></space>
  <h5 ng-if="isUserExist > 0">
    USER OBJECT :
    <space></space>
    {{ user }}
  </h5>
</form>
