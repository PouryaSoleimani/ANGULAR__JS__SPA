<form novalidate name="myForm">
  <!-- FIRST NAME -->
  <div class="input__field">
    <label for="firstname">Firstname:</label>
    <input
      ng-class="{'valid_input': myForm.firstname.$valid}"
      type="text"
      ng-required="true"
      ng-minlength="4"
      name="firstname"
      placeholder="firstname"
      ng-model="user.firstname"
    />
    <p class="form__error" ng-if="!vm.isFormSubmitted && myForm.firstname.$touched && myForm.firstname.$invalid">
      Firstname is Required
    </p>
    <i class="ph-fill ph-seal-check" ng-if="myForm.firstname.$valid"></i>
  </div>
  <space></space>
  <div class="input__field">
    <label for="lastname">Lastname:</label>
    <input
      ng-class="{'valid_input': myForm.lastname.$valid}"
      type="text"
      ng-required="true"
      ng-minlength="5"
      name="lastname"
      placeholder="Lastname"
      ng-model="user.lastname"
    />
    <p class="form__error" ng-if="!vm.isFormSubmitted && myForm.lastname.$touched && myForm.lastname.$invalid">
      Lastname is Required
    </p>
    <i class="ph-fill ph-seal-check err" ng-if="myForm.lastname.$valid"></i>
  </div>
  <space></space>
  <div class="input__field">
    <label for="age">Age:</label>
    <input
      ng-class="{'valid_input': myForm.age.$valid}"
      ng-minlength="1"
      ng-maxlength="2"
      ng-required="true"
      type="text"
      name="age"
      placeholder="Age"
      ng-model="user.age"
    />
    <p class="form__error" ng-if="!vm.isFormSubmitted && myForm.age.$touched && myForm.age.$invalid">
      Please Enter a valid Age
    </p>
    <i class="ph-fill ph-seal-check" ng-if="myForm.age.$valid"></i>
  </div>
  <separator></separator>
  <button ng-disabled="myForm.$invalid" ng-click="submitForm()" class="success m-0 w-full">SUBMIT FORM</button>
  <space ng-if="user"></space>
  <h5 ng-show="user">
    USER OBJECT :
    <space></space>
    {{ user }}
  </h5>
</form>
