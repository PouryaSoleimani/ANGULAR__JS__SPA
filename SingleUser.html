<section id="SINGLE_USER_SECTION">
  <input type="text" ng-model="ID" ng-change="searchHandler()" class="search__input"
    placeholder="Enter User ID to Search">

  <!-- NOT FOUND FALLBACK -->
  <div ng-hide="user" class="no__users">
    <i class="ph-fill ph-seal-warning"></i>
    NO USER WERE FOUND
  </div>

  <!-- SINGLE USER CARD -->
  <div ng-show="user" class="single__user__card">
    <div class="card__header">
      <i class="ph-fill ph-person"></i>
      USER
    </div>
    <div class="card__body">
      <p>
        <i class="ph-fill ph-info"></i>
        {{user.name.firstname.toUpperCase()}} {{user.name.lastname.toUpperCase()}}
      </p>
      <p>
        <i class="ph-bold ph-envelope"></i>
        {{user.email}}
      </p>
      <p>
        <i class="ph-fill ph-map-pin"></i>
        {{user.address.city}} / {{user.address.street}} . {{users.address.number}}
      </p>
      <p>
        <i class="ph-fill ph-signpost"></i>
        {{user.address.zipcode}}
      </p>
    </div>

  </div>

</section>
