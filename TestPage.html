<div ng-app="superhero" ng-controller="TestPageController">
  <!-- FILTERS -->
  <div ng-repeat="person in vm.people track by $index">
    {{ person | uppercase }}
  </div>
  <separator></separator>
  <div ng-repeat="price in vm.prices track by $index">
    {{ price | currency }}
  </div>
  <separator></separator>
  <input type="text" placeholder="search" ng-model="searchExpression">
  {{searchExpression}}
  <separator></separator>
  <superman />
</div>
