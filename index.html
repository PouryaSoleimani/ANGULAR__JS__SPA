<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="/bootstrap.min.css">
  <link rel="stylesheet" href="/style.css">
  <!-- PHOSPHOR ICONS -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <!-- TITLE -->
  <title>ANGULAR_JS_SPA</title>
  <!-- SCRIPTS -->
  <script src="/SCRIPTS/angular.js"></script>
  <script src="/SCRIPTS/angular-route.js"></script>
  <script src="/Modules/App.module.js"></script>
  <!-- USERS -->
  <script src="/Services/Person.service.js"></script>
  <script src="/Controllers/All_Users.controller.js"></script>
  <script src="/Controllers/Add_User.controller.js"></script>
  <script src="/Controllers/Single_User.controller.js"></script>
  <!-- PRODUCTS -->
  <script src="/Services/Product.service.js"></script>
  <script src="/Controllers/All_Products.controller.js"></script>
  <script src="/Controllers/Search_Product.controller.js"></script>
</head>

<body>
  <div class="toast"></div>
  <div class="container crm_container" ng-app="UsersApp">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <!-- LOGO -->
      <div class="logo">
        <img src="./favicon.png" width="35" alt="">
        <h3> ANGULAR.JS PANEL </h3>
      </div>
      <!-- LINKS -->
      <div class="links">
        <!-- USERS -->
        <h4>USERS</h4>
        <a href="#!AllUsers" class="btn btn-info anchor">
          <i class="ph-fill ph-users"></i> ALL USERS
        </a>
        <a href="#!SearchUser" class="btn btn-primary anchor">
          <i class="ph-bold ph-magnifying-glass"></i> SEARCH USER
        </a>
        <a href="#!AddNewPerson" class="btn btn-success anchor">
          <i class="ph-fill ph-plus-circle"></i>
          ADD USER
        </a>
        <div class="horizontal__separator"></div>
        <!-- PRODUCTS -->
        <h4>PRODUCTS </h4>
        <a href="#!AllProducts" class="btn btn-warning anchor">
          <i class="ph-fill ph-users"></i> ALL PRODUCTS
        </a>
        <a href="#!SearchProduct" class="btn btn-danger anchor">
          <i class="ph-bold ph-magnifying-glass"></i> SEARCH PRODUCTS
        </a>
        <a href="#!AddNewProduct" class="btn btn-black anchor">
          <i class="ph-fill ph-plus-circle"></i>
          ADD PRODUCT
        </a>
        <div class="horizontal__separator"></div>
      </div>
    </aside>

    <!-- NG-VIEW -->
    <div ng-view></div>
  </div>

</body>

</html>
